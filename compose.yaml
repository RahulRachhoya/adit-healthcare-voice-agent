services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adit
      POSTGRES_USER: adit
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - assessment-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adit -d adit"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  assessment-postgres:
