[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adit-voice-agent"
version = "0.1.0"
description = "LiveKit healthcare outreach assessment with a modular Opik integration"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=23,<26",
  "fastapi>=0.115,<1",
  "google-genai>=1,<3",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "livekit-agents[google,openai,silero]>=1.8.1,<2",
  "livekit-api>=1,<2",
  "opik>=1.8,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2025",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11,<1",
]

[project.scripts]
adit-agent = "adit_voice_agent.agent.worker:main"
adit-check = "adit_voice_agent.cli:check_setup"
adit-seed = "adit_voice_agent.cli:seed_demo_data"
adit-retry = "adit_voice_agent.cli:retry_finalization"
adit-password = "adit_voice_agent.cli:hash_password"
adit-configure-evaluation = "adit_voice_agent.cli:configure_evaluation"

[tool.hatch.build.targets.wheel]
packages = ["src/adit_voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "postgres: requires a dedicated TEST_DATABASE_URL PostgreSQL database",
  "live: requires explicit live service credentials; never run by default",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".python", ".cache", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
