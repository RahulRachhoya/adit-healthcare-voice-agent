<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf }}">
  <title>{% block title %}Adit · Voice assessment{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/dashboard.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">a</span><span>adit<span class="brand-caption">VOICE ASSESSMENT</span></span></a>
    <div class="topbar-right"><span class="demo-label">Synthetic healthcare demo</span>
    {% if operator %}<form action="/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="button subtle" type="submit">Sign out</button></form>{% endif %}</div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>LiveKit voice agent <span>·</span> Simulated appointments <span>·</span> Opik evaluation</footer>
</body>
</html>
